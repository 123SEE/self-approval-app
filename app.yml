# GitHub App Manifest. Only used when creating the App from a manifest; editing
# it does not change an already-registered App (do that in the App's settings).
#
# Trimmed from upstream to what src/app.ts actually uses. Upstream subscribed to
# issues, pull_request, pull_request_review and pull_request_review_comment and
# requested contents: write — none of which the handler touches. This App can
# approve pull requests, so it carries no write scope it does not need.

# src/app.ts registers exactly one handler: app.on("issue_comment.created").
default_events:
  - issue_comment

default_permissions:
  # context.config() reads .github/self-approval.yml from the default branch.
  contents: read

  # Reactions on the triggering comment, and the "not allowed" reply comment.
  issues: write

  # Required of every App.
  metadata: read

  # Submitting the approving review.
  pull_requests: write

name: self-approval
url: https://github.com/123SEE/self-approval-app
description: Lets whitelisted pull request authors self-approve, by commenting at the App. Fork of self-approval/app, pinned — upstream is unmaintained since 2024-07.
public: false
